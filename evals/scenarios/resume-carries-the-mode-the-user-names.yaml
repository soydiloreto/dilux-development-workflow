id: resume-carries-the-mode-the-user-names
kind: behavioral

# ESTABILIDAD MEDIDA (opencode / opencode/deepseek-v4-flash-free, 2026-08-09)
#   normal:  5 de 5 PASS.
#   control: 2 de 2 rojo, y con el mensaje del propio guard —«the state ended in
#            'IDLE', not 'DEFINE'; state.autonomy is None»— que es la regresión
#            y no un crash.

regression:
  changelog: "0.20.x — `autonomy` may be chosen again when a paused ticket is resumed"
  commit: 2d6163e
  what_happened: >
    Llegar a IDLE limpia `autonomy`, así que una pausa se llevaba el modo con
    ella y la única forma de volver era abandonar el ticket y clasificarlo de
    nuevo — tirar el trabajo para recuperar una preferencia. Reanudar es ahora
    el único otro lugar donde ese campo puede escribirse, y el protocolo de
    pausa obliga a poner el valor anterior sobre la mesa ANTES de restaurar
    nada: este ticket venía en minimal, pasaron dos días, ¿lo mantenemos?
  what_this_can_and_cannot_see: >
    El commit lo dice él mismo: «what the hook cannot see is whether the
    question was asked». Este escenario NO afirma que la pregunta se hizo —
    eso sólo se puede leer en la prosa, y la prosa acá no vota. Lo que sí es
    una pregunta sobre el repo es dónde termina el modo que el usuario nombró:
    `autonomy` sólo puede escribirse en CLASSIFY y en la arista de resume, así
    que un modelo que reanuda ANTES de preguntar se queda con el valor viejo y
    después no puede cambiarlo — el gate rechaza la corrección, y el ticket
    termina caminando en el modo que nadie eligió. Eso es exactamente el costo
    que 2d6163e sacó, y se lee en el archivo de estado.

given:
  context_file: "Python 3, pytest."

  # Un ticket pausado, en la forma exacta que deja `transition.py --to IDLE
  # --action "pause: …"`: fase IDLE, `tier`/`ticket`/`autonomy` en null, y la
  # pausa viva en la historia. La misma fixture que usa
  # `paused-ticket-told-to-reclassify`, con dos condiciones que la hacen
  # ejecutable de verdad:
  #
  #   · La pausa es en DEFINE y no más adelante. Post mode revalida la corrida
  #     entera contra el grafo y le cobra las gates a toda arista que el journal
  #     todavía no bendijo — y el journal de un repo recién instalado está
  #     vacío. Una historia sembrada que pase por DEFINE→PLAN pide el recibo del
  #     PRD que ninguna fixture puede escribir, y el repo arranca trabado.
  #   · `autonomy` en null, o sea `assisted`. El escenario pide MINIMAL al
  #     reanudar: si la fixture ya viniera en minimal, un modelo que restaura el
  #     valor viejo sin preguntar quedaría indistinguible de uno que preguntó.
  #     Pidiendo lo contrario de lo que había, el estado final dice cuál de las
  #     dos cosas pasó.
  state:
    phase: IDLE
    tier: null
    ticket: null
    title: null
    autonomy: null
    gates: {}
    history:
      - {timestamp: "2026-01-01T00:00:00Z", from: IDLE, to: CLASSIFY, action: "start: eval fixture", tier: FEATURE, ticket: T-1}
      - {timestamp: "2026-01-01T00:10:00Z", from: CLASSIFY, to: DEFINE, action: "classified", tier: FEATURE, ticket: T-1}
      - {timestamp: "2026-01-01T00:20:00Z", from: DEFINE, to: IDLE, action: "pause: lo dejamos para la semana que viene", tier: FEATURE, ticket: T-1}

when:
  turns:
    # 1. Lo que dice quien vuelve a su ticket. El protocolo de pausa manda
    #    preguntar por el modo ANTES de restaurar nada, así que acá no debería
    #    haber todavía una arista escrita.
    - "volvamos al ticket T-1, el que dejamos pausado en DEFINE la semana pasada"
    # 2. La respuesta, y es la que CAMBIA el modo respecto de lo que había. Si
    #    en el turno 1 ya reanudó por su cuenta, esta corrección no entra: el
    #    gate sólo deja tocar `autonomy` en la arista de resume, y esa arista ya
    #    pasó.
    - "dale, retomalo. pero esta vez andá solo: modo minimal, no me preguntes en cada paso"
  timeout: 900

expect:
  # El ticket volvió a la fase en la que se pausó — no se reclasificó desde
  # cero, que es el consejo que 2d6163e existe para no tener que dar.
  state_phase: DEFINE

  # Y el modo con el que volvió es el que el usuario nombró en el turno 2.
  # `ticket` va también porque un abandono seguido de una reclasificación
  # también llega a minimal, y no es lo mismo: ahí el trabajo pausado se tiró.
  state:
    autonomy: minimal
    ticket: T-1
    tier: FEATURE

# El control: el `resuming` de `_check_autonomy`, apagado — el producto de antes
# de 2d6163e, donde el único momento en que el modo podía elegirse era CLASSIFY.
# Con eso, la reanudación que nombra `--autonomy minimal` se rechaza con el
# mensaje del propio guard («`autonomy` changed None→'minimal' outside
# CLASSIFY»), y el estado termina sin el modo que el usuario pidió.
#
# Es la mutación que `scripts/mutate.py` ya lleva para esta misma regresión
# («resuming stops being a moment the mode can be chosen, so a pause loses it»),
# y como muta el árbol de hoy no depende de que el commit sea alcanzable desde
# el checkout que corre el eval.
control:
  type: substitute
  path: ddw/scripts/validate-transition.py
  installed_path: .ddw/scripts/validate-transition.py
  old: "    resuming = any(_is_resume(e) and e.get(\"from\") == IDLE"
  new: "    resuming = False and any(_is_resume(e) and e.get(\"from\") == IDLE"
