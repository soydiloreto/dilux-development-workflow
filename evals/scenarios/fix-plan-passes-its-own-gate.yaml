id: fix-plan-passes-its-own-gate
kind: template-vs-gate

regression:
  changelog: "0.18.0 round three — The fix-plan template could not pass the gate it is written for"
  commit: 7dc4369
  what_happened: >
    A plan written exactly as `ddw-create-spec` teaches was refused by F-SPEC-10
    for its layout: the template put error handling in prose, and the validator
    counts errors as a list, because F-SPEC-16 pairs each one with the test that
    names it. The reader is told "your plan is incomplete" about a plan written
    from the repository's own instructions, and there is no move that fixes it.
    Third member of this family — the PRD template, the test report and the
    verification verdict each had the same defect.

given:
  install: claude
  state: null

when:
  instruction: skills/ddw-create-spec/SKILL.md
  # Pull the worked document straight out of the skill the model is told to load.
  extract_between: '###\s+The fix-plan, in the shape the validator reads.*?```markdown\n(.*?)\n```'
  ticket: FIX-001
  write_to: docs/ddw/specs/fix-plan-FIX-001.md
  validator: validate_spec.py
  validator_args: ["${ARTIFACT}", "--tier", "FIX"]

expect:
  validator_accepts_the_worked_document: true

# Antes de 7dc4369 el skill no traía ningún fix-plan trabajado — «no había nada
# que copiar y cada borrador era una adivinanza». El escenario tiene que ponerse
# rojo también para eso: un skill sin forma canónica no se puede juzgar, y lo
# que no se puede juzgar es rojo.
#
# `substitute` y no `restore_from_commit`: ese commit vive en una rama que NO es
# ancestro de ésta, así que un checkout de CI no lo tiene y el control no se
# podía aplicar — rojo por una razón que no es la del escenario. Sacarle el
# título al documento trabajado es el mismo estado: no hay de dónde extraerlo.
control:
  type: substitute
  path: skills/ddw-create-spec/SKILL.md
  old: |-
    ### The fix-plan, in the shape the validator reads
  new: |-
    ### A fix-plan, roughly
