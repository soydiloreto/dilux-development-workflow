name: verify

# Runs on both platforms on purpose. A `find` without `-printf` silently deleted
# 41% of the checks and still exited 0 — the kind of thing only a second OS ever
# finds, and only if something actually runs there.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only is all any of this needs; the default token can write.
permissions:
  contents: read

# A push to a branch with an open PR triggers both events, so the group keeps
# those two runs from overlapping. Queued, not cancelled: a cancelled run is
# indistinguishable from a failed one in the checks list and in the badge, and a
# suite whose job is to report a number should not report an ambiguous one.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  suite:
    name: suite (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          # check_versions --since needs the base commit to diff against, and a
          # shallow clone does not have it.
          fetch-depth: 0
          # `--depth=0` is not "no limit", it is an error: `fatal: depth 0 is not
          # a positive number`. Both pull-request-only steps carried it, so both
          # died at the fetch and neither had ever run — on the first pull
          # request this repository ever opened, which is where it surfaced. The
          # explicit refspec is what makes `origin/<base>` exist for the diff.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install what the suite asserts it needs
        run: |
          # pytest junto a pyyaml, y por la misma razón que la nota de abajo:
          # sin él, la capa rápida sobre el núcleo de enforcement SE SALTEA en
          # CI, y un skip se suma a "N/N pasaron". O sea que los 54 tests que
          # corren en la máquina de quien escribe no habían corrido nunca acá.
          python3 -m pip install --quiet pyyaml pytest
          # The Claude CLI validates the plugin manifests against the real
          # schema. Without it those two checks used to SKIP, and a skip was
          # summed into "N/N passed" — so the manifests had never once been
          # validated in CI. A skip now fails the run, which means this install
          # is load-bearing rather than a convenience.
          npm install -g @anthropic-ai/claude-code
      - name: rsync (absent from the macOS runner image)
        if: runner.os == 'macOS'
        run: command -v rsync >/dev/null || brew install rsync

      - name: The prose agrees with the machine
        run: python3 scripts/lint_method.py

      # Without --since this only checks the numbers agree with each other. With
      # it, a changed rule that did not bump, and a shipped file that changed
      # without the product moving, are errors — which is what stops both fields
      # going back to being decorative.
      #
      # A push gets it too, against the commit before it. The rule used to apply
      # on pull requests alone, and a repository whose own work lands directly on
      # main therefore never applied it to itself — the same shape of exemption
      # the commit-attribution check was written to close.
      - name: Versions describe what they are attached to
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            python3 scripts/check_versions.py --since "origin/${{ github.base_ref }}"
          elif git rev-parse --verify -q HEAD~1 >/dev/null; then
            python3 scripts/check_versions.py --since HEAD~1
          else
            python3 scripts/check_versions.py   # the first commit has no before
          fi

      # Only on a pull request, and only over its own commits: the rule cannot
      # be applied backwards without rewriting history every clone already has,
      # and rewriting it is not what makes the next commit right.
      - name: Commits carry the attribution this repo requires of everyone else
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          python3 scripts/check_commits.py --since "origin/${{ github.base_ref }}"

      # La suite corre los evals además de esto. El paso aparte es para que la
      # falla se lea: adentro de 554 comprobaciones, "un escenario no puede
      # ponerse rojo" queda como una línea entre muchas.
      - name: The instructions lead where the enforcement allows
        run: |
          python3 evals/runner.py --repo . --offline
          python3 evals/runner.py --repo . --offline --control

      - name: The suite
        run: bash scripts/verify_install.sh
